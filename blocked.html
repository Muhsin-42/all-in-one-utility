<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff;
      --fg: #0f0f0f;
      --muted: #606060;
      --line: #e5e5e5;
      --accent: #cc0000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --fg: #f1f1f1;
        --muted: #aaa;
        --line: #303030;
        --accent: #ff4e45;
      }
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0 16px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.5 Roboto, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 28px;
    }
    .site {
      margin: 0 0 32px;
      color: var(--muted);
      font-family: ui-monospace, Menlo, monospace;
      overflow-wrap: anywhere;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .phrase {
      display: block;
      margin-top: 4px;
      color: var(--fg);
      font-weight: 600;
      user-select: none;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--fg);
      font: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      margin-top: 10px;
      padding: 8px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--fg);
      font: inherit;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      border-color: var(--accent);
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .note {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Blocked</h1>
    <p class="site" id="site"></p>
    <form id="unlock" hidden>
      <label for="phrase">Type this to open it for 10 minutes:
        <span class="phrase" id="phrase-text"></span>
      </label>
      <input type="text" id="phrase" autocomplete="off" spellcheck="false">
      <button type="submit" id="go" disabled>Unlock for 10 minutes</button>
    </form>
    <p class="note" id="note"></p>
  </main>
  <script src="blocker.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
