<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="yt">YT</button>
    <button type="button" role="tab" data-tab="speed">Video controller</button>
  </nav>

  <section id="tab-yt" class="panel" role="tabpanel">
    <h1>YT Quick Hide</h1>
    <form id="toggles"></form>
    <div class="footer">
      <button type="button" id="all-on">Hide all</button>
      <button type="button" id="all-off">Show all</button>
    </div>
  </section>

  <section id="tab-speed" class="panel" role="tabpanel" hidden>
    <div class="speed-main">
      <button type="button" class="speed-btn" data-step="-0.1">-0.1</button>
      <button type="button" class="speed-btn current" id="speed-current" title="Reset to 1×">1</button>
      <button type="button" class="speed-btn" data-step="0.1">+0.1</button>
    </div>
    <div class="speed-presets" id="speed-presets"></div>
    <div class="boost">
      <div class="boost-head">
        <span>Volume boost</span>
        <button type="button" class="boost-value" id="boost-value" title="Reset to 100%">100%</button>
      </div>
      <input type="range" id="boost" min="100" max="600" step="10" value="100" aria-label="Volume boost">
    </div>
    <p class="speed-status" id="speed-status"></p>
    <div class="speed-footer">
      <button type="button" class="icon-btn" id="speed-power" title="Turn speed controller on/off">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      </button>
      <button type="button" class="icon-btn" id="speed-gear" title="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
    </div>
    <form id="speed-settings" hidden></form>
  </section>

  <script src="features.js"></script>
  <script src="popup.js"></script>
</body>
</html>
